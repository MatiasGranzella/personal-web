<!DOCTYPE html>
<!--
  Fuente de la imagen para compartir (1200x630). Para regenerarla desde la raíz del repo:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=6000 --screenshot=assets/og-image-v3.png "file://$PWD/og-image.html"
  Si la cambiás, usá un nombre nuevo (v4, v5…) para que LinkedIn no muestre la vieja en caché.
-->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; }
    body {
      font-family: "Schibsted Grotesk", system-ui, sans-serif;
      background: #ffffff;
      color: #111111;
      overflow: hidden;
    }
    .wrap {
      height: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 64px;
      padding: 0 88px;
    }
    .name {
      font-size: 88px; font-weight: 700; line-height: .98;
      letter-spacing: -.045em;
    }
    .name span { color: #1F5F4A; }
    .sub {
      margin-top: 28px;
      font-size: 28px; line-height: 1.35; color: #57574f;
      max-width: 24ch;
    }
    .foot {
      margin-top: 40px;
      display: flex; align-items: center; gap: 14px;
      font-size: 22px; font-weight: 500;
    }
    .pill { background: #1F5F4A; color: #fff; padding: 12px 22px; border-radius: 100px; }
    .url { color: #57574f; }
    .photo {
      width: 330px; height: 330px;
      border-radius: 36px;
      object-fit: cover; object-position: 50% 30%;
      transform: rotate(2deg);
      box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 40px 60px -32px rgba(0,0,0,.45);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="name">Matías<br /><span>Granzella.</span></div>
      <p class="sub">AI Lead en Ualá y desarrollador fullstack. Founder de Vesty y Millo Manager.</p>
      <div class="foot">
        <span class="pill">IA en producción, no en demos.</span>
        <span class="url">matiasgranzella.com</span>
      </div>
    </div>
    <img class="photo" src="assets/foto_perfil.jpeg" alt="" />
  </div>
</body>
</html>
