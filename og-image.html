<!DOCTYPE html>
<!--
  Fuente de la imagen para compartir (1200x630). Para regenerarla desde la raíz del repo:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=6000 --screenshot=assets/og-image-v5.png "file://$PWD/og-image.html"
  Si la cambiás, usá un nombre nuevo (v5, v6…) y actualizá las meta og:image / twitter:image en index.html,
  así LinkedIn no muestra la vieja en caché.
-->
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; }
    body {
      font-family: "Schibsted Grotesk", system-ui, sans-serif;
      background: #ffffff;
      color: #111111;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 470px;
    }
    .copy {
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 76px 0 64px 80px;
    }
    .name {
      font-size: 96px; font-weight: 700; line-height: .95;
      letter-spacing: -.045em;
    }
    .role {
      margin-top: 30px;
      font-size: 30px; font-weight: 500; line-height: 1.3;
      color: #1F5F4A;
    }
    .role span { display: block; color: #57574f; font-weight: 400; }
    .url { font-size: 22px; font-weight: 500; color: #57574f; }
    .photo {
      width: 470px; height: 630px;
      object-fit: cover; object-position: 50% 35%;
      display: block;
    }
  </style>
</head>
<body>
  <div class="copy">
    <div>
      <div class="name">Matías<br />Granzella</div>
      <p class="role">IA generativa en producción<span>AI Lead en Ualá · Desarrollador Full Stack</span></p>
    </div>
    <p class="url">matiasgranzella.com</p>
  </div>
  <img class="photo" src="assets/foto_perfil.jpeg" alt="" />
</body>
</html>
