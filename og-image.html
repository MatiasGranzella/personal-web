<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: #0E0B2E;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
    .glow--teal { width: 560px; height: 560px; background: rgba(60,203,206,.28); top: -160px; left: -120px; }
    .glow--purple { width: 620px; height: 620px; background: rgba(113,93,242,.32); bottom: -220px; right: -140px; }
    .frame {
      position: absolute; inset: 0;
      border: 1px solid rgba(255,255,255,.08);
      margin: 22px; border-radius: 28px;
    }
    .wrap {
      position: relative; z-index: 2;
      height: 100%;
      display: flex; align-items: center;
      padding: 0 80px;
      gap: 64px;
    }
    .left { flex: 1; }
    .badge {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 18px; font-weight: 600; letter-spacing: .02em;
      color: #3CCBCE;
      background: rgba(60,203,206,.12);
      border: 1px solid rgba(60,203,206,.3);
      padding: 10px 20px; border-radius: 100px;
      margin-bottom: 30px;
    }
    .badge::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #3CCBCE; }
    .name {
      font-family: "Fraunces", serif;
      font-size: 78px; font-weight: 600; line-height: .98;
      letter-spacing: -.02em;
      margin-bottom: 22px;
    }
    .headline {
      font-size: 30px; font-weight: 600; line-height: 1.25;
      margin-bottom: 16px;
    }
    .headline .teal { color: #3CCBCE; }
    .headline .purple { color: #9B8CFF; }
    .tagline { font-size: 21px; color: rgba(255,255,255,.6); line-height: 1.4; max-width: 22ch; margin-bottom: 40px; }
    .foot { display: flex; align-items: center; gap: 22px; font-size: 19px; font-weight: 600; color: rgba(255,255,255,.85); }
    .foot .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.35); }
    .vesty-pill {
      background: linear-gradient(100deg, #3CCBCE, #715DF2);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }

    .right { flex-shrink: 0; }
    .photo-wrap {
      width: 320px; height: 380px;
      border-radius: 28px;
      padding: 4px;
      background: linear-gradient(140deg, #3CCBCE, #715DF2);
      box-shadow: 0 30px 80px rgba(113,93,242,.45);
    }
    .photo {
      width: 100%; height: 100%;
      border-radius: 24px;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div class="glow glow--teal"></div>
  <div class="glow glow--purple"></div>
  <div class="frame"></div>

  <div class="wrap">
    <div class="left">
      <span class="badge">Buenos Aires, Argentina</span>
      <div class="name">Matías<br/>Granzella</div>
      <div class="headline">
        <span class="teal">AI Lead</span> @ Ualá · <span class="purple">Founder</span> de Vesty
      </div>
      <div class="tagline">Construyo IA en producción — y la app que unifica tus inversiones.</div>
      <div class="foot">
        <span class="vesty-pill">vestyapp.io</span>
        <span class="dot"></span>
        <span>in/matias-federico-granzella</span>
      </div>
    </div>
    <div class="right">
      <div class="photo-wrap">
        <img class="photo" src="assets/foto_perfil.jpeg" alt="Matías Granzella" />
      </div>
    </div>
  </div>
</body>
</html>
